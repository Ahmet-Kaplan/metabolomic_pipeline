# ============================================================
# Biomarker Discovery MLOps — pyproject.toml
# PEP 621 project metadata + tool configs
# ============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodisc"
version = "0.1.0"
description = "MLOps pipeline for untargeted LC-MS metabolic biomarker discovery from Progenesis QI output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Mohammed Saeed Al-Huraibi" },
  { name = "Ihsan Yozgat" },
  { name = "Ahmet Kaplan", email = "ahmet.kaplan@medipol.edu.tr" },
]
keywords = ["metabolomics", "mass-spectrometry", "biomarker", "mlops", "lc-ms"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# -------- Runtime dependencies --------
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=15,<20",
  "numpy>=1.26,<3",
  "pandera>=0.20,<1",
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "structlog>=24.1",
  "typer>=0.12,<1",
  "rich>=13.7",
  # Core scientific — used from Stage 2 onward (PCA, Hotelling T², stats stages)
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  # Stage 8 — read Picache 2019 (and any future) Excel-format CCS reference data
  "openpyxl>=3.1,<4",
  # Multiverse HTML reports (jinja2 templates used in reporting/core.py)
  "jinja2>=3.1",
  # missForest imputation persists models via joblib
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
# Stage 2 (EDA) extras
eda = [
  "ydata-profiling>=4.8",
  "plotly>=5.20,<6",  # kaleido 0.2.1 export needs plotly 5.x
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "kaleido==0.2.1",   # PNG export; pre-1.0 ships self-contained Chromium so no system-Chrome dep
  # ydata-profiling 4.x still imports pkg_resources, which setuptools 82
  # removed. Pin setuptools until ydata-profiling migrates. See
  # https://github.com/ydataai/ydata-profiling/issues/1733 (similar).
  "setuptools<81",
]

# Post-multiverse pathway enrichment (KEGG, ChEBI, ChEMBL queries)
enrichment = [
  "bioservices>=1.10,<2",
]

# Dev tooling
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pandas-stubs",
]

[project.urls]
Repository = "https://github.com/Ahmet-Kaplan/metabolomic_pipeline"

[project.scripts]
biodisc = "biodisc.cli:app"

# ============================================================
# setuptools — src layout
# ============================================================
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biodisc = ["py.typed"]

# ============================================================
# ruff — lint + format (replaces black, isort, flake8)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff-specific
  "TID", # tidy-imports
]
ignore = [
  "E501",     # line length (handled by formatter)
  "RUF001",   # ambiguous unicode (× and – are intentional in plot titles / scientific notation)
  "RUF002",   # ambiguous unicode in docstrings (same reason)
  "RUF003",   # ambiguous unicode in comments (same reason)
  "N806",     # uppercase variables allowed (sklearn convention: X = feature matrix)
  "B008",     # typer's Option/Argument default calls are the standard pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]  # allow non-snake test fixtures

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# mypy — strict typing
# ============================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "pandera.*",
  "hydra.*",
  "omegaconf.*",
  "structlog.*",
  "plotly.*",
  "sklearn.*",
  "scipy.*",
  "threadpoolctl.*",
]
ignore_missing_imports = true

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--showlocals",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: unit tests (fast, isolated)",
  "integration: integration tests (may read files)",
  "slow: tests that take > 1s",
]

[tool.coverage.run]
source = ["src/biodisc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
